site_name: go-vet-analyzers
site_description: Pure-Go go vet analyzers that turn project conventions into CI checks — nonnil (Null-Object invariant) and respondto (reflective-dispatch compile-checking). No cgo, 100% coverage, multi-arch CI.
site_url: https://go-vet-analyzers.github.io/docs/
repo_url: https://github.com/go-vet-analyzers
repo_name: go-vet-analyzers
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle: { icon: material/brightness-auto, name: Switch to light mode }
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-7, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/brightness-4, name: Switch to system preference }
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]

extra_css: [stylesheets/brand.css]
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Analyzers:
      - "nonnil — Null-Object enforcer": analyzers/nonnil.md
      - "respondto — reflective-dispatch checker": analyzers/respondto.md
